name: Deploy Tenantrix Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 20m

          script: |
            set -e

            cd "${{ secrets.EC2_PROJECT_PATH }}"

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building application image once..."
            docker compose -f docker-compose.ec2.yml build backend

            echo "Starting containers..."
            docker compose -f docker-compose.ec2.yml up -d --remove-orphans

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Checking running containers..."
            docker compose -f docker-compose.ec2.yml ps

            echo "Checking API..."
            sleep 15
            curl --fail --silent --show-error http://localhost:5001

            echo "Deployment completed successfully."
