services:
  mongo:
    image: mongo:8
    container_name: saas-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    image: tenantrix-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5001
      API_BASE_URL: https://tenantrix.duckdns.org
      MONGO_URI: mongodb://mongo:27017/backend-saas?retryWrites=false
      MONGO_USE_TRANSACTIONS: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379

    # Nginx can access it locally, but port 5001 is not exposed publicly.
    ports:
      - "127.0.0.1:5001:5001"

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  order-worker:
    image: tenantrix-app:latest
    container_name: saas-order-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/backend-saas?retryWrites=false
      MONGO_USE_TRANSACTIONS: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run start:worker:order

  email-worker:
    image: tenantrix-app:latest
    container_name: saas-email-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/backend-saas?retryWrites=false
      MONGO_USE_TRANSACTIONS: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run start:worker:email

volumes:
  mongo_data:
  redis_data:
